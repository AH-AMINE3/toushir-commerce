name: Verify commerce
on:
  push:
    branches: [commerce-ecosystem]
  pull_request:
    branches: [commerce-ecosystem]
permissions:
  contents: read
concurrency:
  group: verify-commerce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build both browser applications and API
        run: bash scripts/build-all.sh
      - name: Verify native TypeScript
        run: npm --prefix apps/mobile run typecheck
      - name: Domain invariants
        run: dotnet test backend/tests/Toushir.Domain.Tests.csproj --configuration Release --logger trx
      - name: Run persistent API scenarios
        env:
          Demo__Enabled: 'true'
          ASPNETCORE_ENVIRONMENT: Development
          API_URL: http://127.0.0.1:5860
          TOUSHIR_TEST_RESULTS: engagement-verification.json
          TOUSHIR_WAREHOUSE_RESULTS: warehouse-verification.json
        run: |
          # A fresh process per suite preserves public demo rate limits.
          for suite in api operations routes oidc engagement warehouse supplier-documents; do
            export DataPath="$RUNNER_TEMP/toushir-$suite"
            dotnet run --project backend/Toushir.Wholesale.csproj --no-build --urls "$API_URL" > "$RUNNER_TEMP/api-$suite.log" 2>&1 &
            API_PID=$!
            trap 'kill "$API_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$API_URL/api/health" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$API_URL/api/health"
            if [ "$suite" = engagement ]; then
              python3 scripts/test-engagement.py "$API_URL"
            elif [ "$suite" = supplier-documents ]; then
              python3 scripts/test-supplier-documents.py "$API_URL"
            elif [ "$suite" = warehouse ]; then
              python3 scripts/test-warehouse.py "$API_URL"
            else
              node "backend/scripts/verify-$suite.mjs"
            fi
            kill "$API_PID"
            wait "$API_PID" || true
          done
      - name: Install browser verifier
        run: |
          npm --prefix tests/browser ci
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Verify the packaged desktop and mobile browser apps
        env:
          Demo__Enabled: 'true'
          ASPNETCORE_ENVIRONMENT: Development
          WEB_URL: http://127.0.0.1:5860
        run: |
          for suite in smoke identity business warehouse supplier mobile; do
            export DataPath="$RUNNER_TEMP/browser-$suite"
            dotnet run --project backend/Toushir.Wholesale.csproj --no-build --urls "$WEB_URL" > "$RUNNER_TEMP/browser-$suite.log" 2>&1 &
            API_PID=$!
            trap 'kill "$API_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$WEB_URL/api/health" > /dev/null; then break; fi
              sleep 1
            done
            npm --prefix tests/browser run "$suite"
            kill "$API_PID"
            wait "$API_PID" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            backend/*verification.json
            engagement-verification.json
            warehouse-verification.json
            supplier-documents-verification.json
            tests/browser/reports/
