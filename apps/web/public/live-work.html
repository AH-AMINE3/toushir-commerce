<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOUSHIR · Aperçu en direct</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#edf3f1;color:#0f2c2c}header{min-height:78px;padding:16px 24px;display:flex;align-items:center;gap:24px;background:#fff;border-bottom:1px solid #dbe5e1}h1{font-size:19px;letter-spacing:-.5px;margin:0 0 4px}p{margin:0;color:#52655d;font-size:12px}.status{margin-left:auto;max-width:380px}.dot{display:inline-block;width:8px;height:8px;background:#087f4f;border-radius:50%;margin-right:7px}.workspace{height:calc(100dvh - 78px);display:grid;grid-template-columns:minmax(650px,1fr) 426px;gap:16px;padding:16px;overflow:auto}.pane{min-height:650px;background:#fff;border:1px solid #d4e1db;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e2eae6;font-weight:600}.bar a{font-size:12px;color:#087f4f;text-decoration:none;padding:10px 0}.bar a:hover{text-decoration:underline}iframe{border:0;width:100%;flex:1;background:#fff}.mobile iframe{width:402px;align-self:center}button{border:1px solid #ccd9d2;background:white;border-radius:8px;padding:9px 12px;color:#0f2c2c;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #087f4f;outline-offset:3px}@media(max-width:1050px){.workspace{grid-template-columns:100%;height:auto}.pane{height:800px}.mobile{max-width:426px;width:100%;justify-self:center}header{flex-wrap:wrap;gap:10px}.status{margin-left:0}.mobile iframe{max-width:100%}}
</style></head><body><header><div><h1>TOUSHIR · Aperçu en direct</h1><p>Deux applications connectées au même espace de démonstration.</p></div><button id="refresh">Actualiser les deux</button><div class="status"><p><span class="dot"></span><span id="phase">Chargement de l’aperçu…</span></p><p id="built" style="margin-top:5px">Les écrans se rechargent lorsqu’une nouvelle version est prête.</p></div></header><main class="workspace"><section class="pane"><div class="bar"><span>Plateforme grossiste</span><a href="/" target="_blank" rel="noopener">Ouvrir en grand ↗</a></div><iframe id="desktop" title="Plateforme grossiste Toushir" src="/"></iframe></section><section class="pane mobile"><div class="bar"><span>Application commerçant</span><a href="/mobile/merchant" target="_blank" rel="noopener">Ouvrir l’application ↗</a></div><iframe id="merchant" title="Application commerçant Toushir" src="about:blank" data-src="/mobile/merchant"></iframe></section></main><script>
let build;const merchant=document.getElementById('merchant');const shared=setInterval(()=>{if(localStorage.getItem('toushir-demo-workspace')){merchant.src=merchant.dataset.src;clearInterval(shared)}},250);function refresh(){for(const id of ['desktop','merchant']){const frame=document.getElementById(id);try{frame.contentWindow.location.reload()}catch{frame.src=frame.src}}}document.getElementById('refresh').onclick=refresh;async function poll(){try{const r=await fetch('/preview-build.json',{cache:'no-store'});if(!r.ok)return;const data=await r.json();document.getElementById('phase').textContent=data.phase;document.getElementById('built').textContent='Dernière version · '+(data.builtAt?new Date(data.builtAt).toLocaleTimeString('fr-FR'):'parcours connecté');const version=data.version||data.builtAt;if(build&&build!==version)refresh();build=version}catch{document.getElementById('phase').textContent='Reconnexion à l’aperçu…'}}poll();setInterval(poll,5000);
</script></body></html>
